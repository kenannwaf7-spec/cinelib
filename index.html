<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineLib - Free Streaming Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- iOS PWA Capabilities -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CineLib">
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col font-sans">

  <!-- Header / Navigation -->
  <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i class="fa-solid font-bold text-red-600 text-2xl fa-film"></i>
        <span class="text-xl font-bold tracking-wider text-red-600">CineLib</span>
      </div>
      <div id="userStatus" class="flex items-center gap-3">
        <button onclick="openAuthModal()" class="bg-red-600 hover:bg-red-700 px-4 py-1.5 rounded-lg text-sm font-semibold transition">Login / Register</button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-grow max-w-7xl mx-auto w-full px-4 py-6">
    <section class="mb-8 text-center">
      <h1 class="text-3xl font-extrabold mb-2">Watch Movies & Series Free</h1>
      <p class="text-gray-400 text-sm">Create an account to save your watchlist and stream anywhere.</p>
    </section>

    <!-- Content Grid Placeholder -->
    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4" id="movieGrid">
      <div class="bg-gray-900 rounded-lg overflow-hidden border border-gray-800 p-2">
        <div class="h-48 bg-gray-800 rounded mb-2 flex items-center justify-center text-gray-500">Poster</div>
        <h3 class="font-bold text-sm">Sample Movie</h3>
        <p class="text-xs text-gray-400">2026 • Action</p>
      </div>
    </div>
  </main>

  <!-- Auth Modal -->
  <div id="authModal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-50">
    <div class="bg-gray-900 border border-gray-800 w-full max-w-md p-6 rounded-xl relative">
      <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white">✕</button>
      <h2 id="modalTitle" class="text-xl font-bold mb-4 text-center">Login to CineLib</h2>
      
      <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
        <div>
          <label class="block text-xs text-gray-400 mb-1">Email</label>
          <input type="email" id="authEmail" required class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-sm focus:outline-none focus:border-red-600">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Password</label>
          <input type="password" id="authPassword" required class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-sm focus:outline-none focus:border-red-600">
        </div>
        <button type="submit" id="authSubmitBtn" class="w-full bg-red-600 hover:bg-red-700 py-2 rounded font-semibold text-sm transition">Login</button>
      </form>

      <div class="mt-4 text-center text-xs text-gray-400">
        <span id="toggleText">Don't have an account?</span>
        <button onclick="toggleAuthMode()" id="toggleBtn" class="text-red-500 font-semibold ml-1 underline">Register</button>
      </div>
    </div>
  </div>

  <!-- Firebase Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDyIedYSKXuC9uJLLfWdwmNRiIsZmAPWX4",
      authDomain: "cinelib-dbc8d.firebaseapp.com",
      projectId: "cinelib-dbc8d",
      storageBucket: "cinelib-dbc8d.firebasestorage.app",
      messagingSenderId: "392966812345",
      appId: "1:392966812345:web:f7d3aaa472df295cafe168",
      measurementId: "G-Q8J9Y8G90F"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    let isLoginMode = true;

    window.openAuthModal = () => document.getElementById('authModal').classList.remove('hidden');
    window.closeAuthModal = () => document.getElementById('authModal').classList.add('hidden');

    window.toggleAuthMode = () => {
      isLoginMode = !isLoginMode;
      document.getElementById('modalTitle').innerText = isLoginMode ? 'Login to CineLib' : 'Register New Account';
      document.getElementById('authSubmitBtn').innerText = isLoginMode ? 'Login' : 'Register';
      document.getElementById('toggleText').innerText = isLoginMode ? "Don't have an account?" : "Already have an account?";
      document.getElementById('toggleBtn').innerText = isLoginMode ? 'Register' : 'Login';
    };

    window.handleAuth = async (e) => {
      e.preventDefault();
      const email = document.getElementById('authEmail').value;
      const password = document.getElementById('authPassword').value;

      try {
        if (isLoginMode) {
          await signInWithEmailAndPassword(auth, email, password);
          alert("Welcome back!");
        } else {
          await createUserWithEmailAndPassword(auth, email, password);
          alert("Account created successfully!");
        }
        closeAuthModal();
      } catch (err) {
        alert(err.message);
      }
    };

    window.handleSignOut = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
      const userStatusDiv = document.getElementById('userStatus');
      if (user) {
        userStatusDiv.innerHTML = `
          <span class="text-xs text-gray-300">${user.email}</span>
          <button onclick="handleSignOut()" class="bg-gray-800 hover:bg-gray-700 px-3 py-1 rounded text-xs">Logout</button>
        `;
      } else {
        userStatusDiv.innerHTML = `
          <button onclick="openAuthModal()" class="bg-red-600 hover:bg-red-700 px-4 py-1.5 rounded-lg text-sm font-semibold transition">Login / Register</button>
        `;
      }
    });
  </script>
</body>
</html>
