        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0B0E14;
        }
        ::-webkit-scrollbar-thumb {
            background: #232D3F;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #374151;
        }

        /* Video Container explicit scaling to fix Google Drive top/bottom cutoffs */
        .video-container {
            position: relative;
            width: 100%;
            background-color: #000;
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        /* Ensures iframe controls (Google Drive header/footer) fit accurately */
        .video-iframe {
            width: 100%;
            height: 540px;
            border: 0;
            display: block;
        }

        @media (max-width: 768px) {
            .video-iframe {
                height: 320px;
            }

        .glass-panel {
            background: rgba(21, 28, 40, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);

        .no-scrollbar::-webkit-scrollbar {
            display: none;

        .no-scrollbar {

            scrollbar-width: none;

        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase configuration for cinelib-dbc8d
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForCineLibAppProduction123",
            authDomain: "cinelib-dbc8d.firebaseapp.com",
            projectId: "cinelib-dbc8d",
            storageBucket: "cinelib-dbc8d.appspot.com",
            messagingSenderId: "892374892374",
            appId: "1:892374892374:web:a1b2c3d4e5f6g7h8"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Global State Access
        window.firebaseAuth = auth;
        window.firebaseDb = db;

        // Firebase State Listener
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.currentUser = user;
                document.getElementById('auth-btn-text').innerText = user.email.split('@')[0];
            } else {
                window.currentUser = null;
                document.getElementById('auth-btn-text').innerText = 'Sign In';
            }
        });
    </script>

        function navigateTo(view, params = null) {
            appState.currentView = view;
            
            // Highlight nav links
            document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('text-brand-red', 'font-semibold'));
            document.querySelectorAll('.nav-link').forEach(el => el.classList.add('text-gray-400'));
            
            const activeNav = document.getElementById(`nav-${view}`);
            if (activeNav) {
                activeNav.classList.remove('text-gray-400');
                activeNav.classList.add('text-brand-red', 'font-semibold');
            }

            renderView(view, params);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderView(view, params) {
            const container = document.getElementById('app-container');

            if (view === 'home') {
                container.innerHTML = getHomeHTML();
            } else if (view === 'watch') {
                container.innerHTML = getWatchPlayerHTML(params || CATALOG.featured);
            } else if (view === 'series') {
                container.innerHTML = getSeriesHTML();
            } else if (view === 'movies') {
                container.innerHTML = getMoviesHTML();
            } else if (view === 'library') {
                container.innerHTML = getLibraryHTML();
            } else if (view === 'saved') {
                container.innerHTML = getSavedHTML();
            } else if (view === 'profile') {
                container.innerHTML = getProfileHTML();
            }
        }

        function getProfileHTML() {
            const user = window.currentUser;
            return `
                <div class="max-w-xl mx-auto glass-panel border border-brand-border rounded-2xl p-6 space-y-6">

        function playMovie(id) {
            const movie = CATALOG.movies.find(m => m.id === id);
            if (movie) {
                navigateTo('watch', movie);
            }
        }

        function switchPlayerMode(mode) {
            appState.playerMode = mode;
            renderView('watch', CATALOG.featured);
        }

        function changeSeason(seasonNum) {
            appState.selectedSeason = parseInt(seasonNum);
            renderView('watch', CATALOG.featured);
        }

        function changeEpisode(epNum) {
            appState.selectedEpisode = epNum;
            renderView('watch', CATALOG.featured);
        }

        function toggleSaveItem(id) {
            const idx = appState.savedItems.indexOf(id);
            if (idx > -1) {
                appState.savedItems.splice(idx, 1);
            } else {
                appState.savedItems.push(id);
            }
            localStorage.setItem('cinelib_saved', JSON.stringify(appState.savedItems));
            updateSavedCount();
            renderView(appState.currentView);
        }

        function isSaved(id) {
            return appState.savedItems.includes(id);
        }

        function updateSavedCount() {
            const countEl = document.getElementById('saved-count');
            if (countEl) countEl.innerText = appState.savedItems.length;
        }

        function openPdfModal(title, url) {
            document.getElementById('pdf-title').innerText = title;
            document.getElementById('pdf-iframe').src = url;
            document.getElementById('pdf-modal').classList.remove('hidden');
        }

        function closePdfModal() {
            document.getElementById('pdf-modal').classList.add('hidden');
            document.getElementById('pdf-iframe').src = '';
        }

        function openAuthModal() {
            document.getElementById('auth-modal').classList.remove('hidden');
        }

        function closeAuthModal() {
            document.getElementById('auth-modal').classList.add('hidden');
        }

        function toggleAuthMode() {
            appState.authMode = appState.authMode === 'signin' ? 'signup' : 'signin';
            document.getElementById('auth-modal-title').innerText = appState.authMode === 'signin' ? 'Welcome to CineLib' : 'Create Account';
            document.getElementById('auth-submit-btn').innerText = appState.authMode === 'signin' ? 'Sign In' : 'Register Account';
            document.getElementById('auth-toggle-btn').innerText = appState.authMode === 'signin' ? 'Need an account? Sign up now' : 'Already have an account? Sign in';
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const errEl = document.getElementById('auth-error-msg');
            errEl.classList.add('hidden');

            try {
                if (window.firebaseAuth) {
                    if (appState.authMode === 'signin') {
                        await window.firebaseAuth.signInWithEmailAndPassword(window.firebaseAuth, email, password);
                    } else {
                        await window.firebaseAuth.createUserWithEmailAndPassword(window.firebaseAuth, email, password);
                    }
                    closeAuthModal();
                    navigateTo('profile');
                } else {
                    errEl.innerText = "Firebase not initialized. Demo mode signed in.";
                    errEl.classList.remove('hidden');
                }
            } catch (err) {
                errEl.innerText = err.message || "Authentication error";
                errEl.classList.remove('hidden');
            }
        }

        async function handleSignOut() {
            if (window.firebaseAuth) {
                await window.firebaseAuth.signOut(window.firebaseAuth);
                navigateTo('home');
            }
        }

        function handleSearch(query) {
            const dropdown = document.getElementById('search-results-dropdown');
            if (!query.trim()) {
                dropdown.classList.add('hidden');
                return;
            }

            const results = [
                ...CATALOG.movies.filter(m => m.title.toLowerCase().includes(query.toLowerCase())),
                ...CATALOG.series.filter(s => s.title.toLowerCase().includes(query.toLowerCase())),
                ...CATALOG.books.filter(b => b.title.toLowerCase().includes(query.toLowerCase()))
            ];

            if (results.length === 0) {
                dropdown.innerHTML = `<p class="text-xs text-gray-500 p-3 text-center">No results found</p>`;
            } else {
                dropdown.innerHTML = results.map(r => `
                    <div onclick="navigateTo('${r.pages ? 'library' : 'watch'}'); document.getElementById('search-results-dropdown').classList.add('hidden');" class="p-2 hover:bg-brand-dark rounded-lg cursor-pointer flex items-center justify-between">
                        <span class="text-xs text-white font-bold">${r.title}</span>
                        <span class="text-[10px] uppercase text-brand-red font-semibold">${r.pages ? 'Book' : 'Video'}</span>
                    </div>
                `).join('');
            }
            dropdown.classList.remove('hidden');
        }

        function shareLink() {
            navigator.clipboard.writeText(window.location.href);
            alert("Shareable link copied to clipboard!");
        }
    </script>
