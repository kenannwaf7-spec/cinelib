<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineLib - Streaming & Movies</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0f19; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="pb-24">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 px-4 py-3 flex items-center justify-between">
        <h1 class="text-xl font-black text-red-600 tracking-wider">Cine<span class="text-white">Lib</span></h1>
        
        <div class="flex items-center gap-2">
            <div class="relative w-36 sm:w-60">
                <input type="text" id="searchInput" onkeyup="handleSearch()" placeholder="لێگەڕیان..." class="w-full bg-slate-800/80 border border-slate-700/50 text-xs text-slate-200 rounded-full pr-8 pl-3 py-1.5 focus:outline-none focus:border-red-500">
                <i class="fa-solid fa-magnifying-glass absolute right-2.5 top-2.5 text-xs text-slate-400"></i>
            </div>
            <button onclick="openAuthModal()" class="bg-red-600 hover:bg-red-700 text-white text-xs px-3 py-1.5 rounded-full font-bold transition">
                <i class="fa-solid fa-user-plus"></i>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main id="mainContainer" class="p-4 max-w-5xl mx-auto space-y-6">
        <!-- Dynamic Content -->
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur border-t border-slate-800 flex justify-around py-2.5 z-40">
        <button onclick="switchTab('movies')" id="tabMovies" class="flex flex-col items-center text-red-500 font-bold">
            <i class="fa-solid fa-film text-lg"></i>
            <span class="text-[10px] mt-1">فیلم</span>
        </button>
        <button onclick="switchTab('series')" id="tabSeries" class="flex flex-col items-center text-slate-400">
            <i class="fa-solid fa-tv text-lg"></i>
            <span class="text-[10px] mt-1">زنجیرە</span>
        </button>
        <button onclick="switchTab('watchlist')" id="tabWatchlist" class="flex flex-col items-center text-slate-400">
            <i class="fa-solid fa-bookmark text-lg"></i>
            <span class="text-[10px] mt-1">پەرتووکخانە</span>
        </button>
        <button onclick="switchTab('profile')" id="tabProfile" class="flex flex-col items-center text-slate-400">
            <i class="fa-solid fa-user text-lg"></i>
            <span class="text-[10px] mt-1">پرۆفایل</span>
        </button>
    </nav>

    <!-- Video Player Modal -->
    <div id="playerModal" class="fixed inset-0 bg-black/95 z-50 hidden flex flex-col justify-center items-center p-2 sm:p-4">
        <button onclick="closePlayer()" class="absolute top-4 left-4 text-white text-3xl z-50 hover:text-red-500"><i class="fa-solid fa-xmark"></i></button>
        <div class="w-full max-w-4xl aspect-video bg-black rounded-xl overflow-hidden relative border border-slate-800">
            <iframe id="videoPlayer" class="w-full h-full" src="" frameborder="0" allowfullscreen allow="autoplay"></iframe>
        </div>
    </div>

    <!-- Auth Modal -->
    <div id="authModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-md relative shadow-2xl">
            <button onclick="closeAuthModal()" class="absolute top-4 left-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            <div class="text-center mb-6">
                <h2 class="text-xl font-bold text-white">چوونەژوور / دروستکرنا هەژمارێ</h2>
                <p class="text-xs text-slate-400 mt-1">بەشدار ببە د سیستەمێ ماڵپەڕی دا</p>
            </div>
            <form onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">ئیمەیڵ</label>
                    <input type="email" required placeholder="example@gmail.com" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-red-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">پاسۆرد</label>
                    <input type="password" required placeholder="••••••••" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-red-500">
                </div>
                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded-lg text-xs font-bold transition">چوونەژوور</button>
            </form>
        </div>
    </div>

<script>
    // Movies Database
    const moviesData = [
        {
            id: 'm-ezas',
            title: 'ezas',
            category: 'action',
            year: 2026,
            rating: '9.8',
            duration: '2h 00m',
            image: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800',
            banner: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=1200',
            videoUrl: 'https://drive.google.com/uc?export=download&id=12wDX1DDh5qcBjVxDS0Wi-doPSccp3t4v',
            description: 'فیلمێ نوو یێ ezas ڕاستەوخۆ تەماشا بکە.'
        },
        {
            id: 'm1',
            title: 'Dune: Part Two',
            category: 'sci-fi',
            year: 2024,
            rating: '8.6',
            duration: '2h 46m',
            image: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=800',
            banner: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=1200',
            videoUrl: 'https://www.youtube.com/embed/Way9Dexny3w',
            description: 'Paul Atreides unites with Chani and the Fremen while seeking revenge.'
        },
        {
            id: 'm2',
            title: 'The Dark Knight',
            category: 'action',
            year: 2008,
            rating: '9.0',
            duration: '2h 32m',
            image: 'https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0?w=800',
            banner: 'https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0?w=1200',
            videoUrl: 'https://www.youtube.com/embed/EXeTwQWrcwY',
            description: 'When the menace known as the Joker wreaks havoc and chaos.'
        }
    ];

    // Series Database (Including Game of Thrones)
    const gotSeasons = {};
    for(let s = 1; s <= 8; s++) {
        gotSeasons[`s${s}`] = [
            { id: `got_s${s}_e1`, title: `وەرزێ ${s} - ئەلقەیا 1`, duration: '55m', videoUrl: 'https://www.youtube.com/embed/Way9Dexny3w' },
            { id: `got_s${s}_e2`, title: `وەرزێ ${s} - ئەلقەیا 2`, duration: '56m', videoUrl: 'https://www.youtube.com/embed/Way9Dexny3w' },
            { id: `got_s${s}_e3`, title: `وەرزێ ${s} - ئەلقەیا 3`, duration: '57m', videoUrl: 'https://www.youtube.com/embed/Way9Dexny3w' }
        ];
    }

    const seriesData = [
        {
            id: 's-got',
            title: 'Game of Thrones',
            seasons: 8,
            rating: '9.2',
            image: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=800',
            description: 'زنجیرا ناودارا جیهانی یا Game of Thrones تەواوی وەرز و ئەلقە.',
            episodes: gotSeasons
        },
        {
            id: 's-hotd',
            title: 'House of the Dragon',
            seasons: 2,
            rating: '8.4',
            image: 'https://images.unsplash.com/photo-1514539079130-25950c84af65?w=800',
            description: 'چیروکا خێزانا تارگارین بەریا ڕوودانێن Game of Thrones.'
        }
    ];

    let currentTab = 'movies';
    let watchlist = JSON.parse(localStorage.getItem('cinelib_watchlist')) || [];

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('nav button').forEach(b => b.className = 'flex flex-col items-center text-slate-400');
        
        if(tab === 'movies') {
            document.getElementById('tabMovies').className = 'flex flex-col items-center text-red-500 font-bold';
            renderMovies();
        } else if(tab === 'series') {
            document.getElementById('tabSeries').className = 'flex flex-col items-center text-red-500 font-bold';
            renderSeries();
        } else if(tab === 'watchlist') {
            document.getElementById('tabWatchlist').className = 'flex flex-col items-center text-red-500 font-bold';
            renderWatchlist();
        } else if(tab === 'profile') {
            document.getElementById('tabProfile').className = 'flex flex-col items-center text-red-500 font-bold';
            renderProfile();
        }
    }

    function renderMovies(search = '') {
        const container = document.getElementById('mainContainer');
        let filtered = moviesData;
        if(search) filtered = filtered.filter(m => m.title.toLowerCase().includes(search.toLowerCase()));

        let html = `
            <!-- Banner Hero -->
            <div class="relative rounded-2xl overflow-hidden border border-slate-800 bg-slate-900 aspect-[16/9] sm:aspect-[21/9]">
                <img src="${moviesData[0].banner}" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent flex flex-col justify-end p-4">
                    <span class="bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded self-start mb-2">دیارترین</span>
                    <h2 class="text-2xl font-black text-white mb-1">${moviesData[0].title}</h2>
                    <div class="flex gap-2 mt-2">
                        <button onclick="playMedia('${moviesData[0].videoUrl}')" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-4 py-2 rounded-lg flex items-center gap-2">
                            <i class="fa-solid fa-play"></i> تەماشابکە
                        </button>
                    </div>
                </div>
            </div>

            <h3 class="text-base font-bold text-white pt-2">هەمی فیلم</h3>
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
        `;

        filtered.forEach(m => {
            const isSaved = watchlist.includes(m.id);
            html += `
                <div class="bg-slate-900/60 rounded-xl overflow-hidden border border-slate-800 flex flex-col justify-between">
                    <div class="relative aspect-[2/3]">
                        <img src="${m.image}" class="w-full h-full object-cover">
                        <button onclick="toggleSave('${m.id}')" class="absolute top-2 left-2 w-7 h-7 bg-black/70 rounded-full flex items-center justify-center text-xs backdrop-blur">
                            <i class="${isSaved ? 'fa-solid' : 'fa-regular'} fa-bookmark text-red-500"></i>
                        </button>
                        <span class="absolute bottom-2 right-2 bg-black/80 px-1.5 py-0.5 rounded text-[10px] text-amber-400 font-bold">
                            <i class="fa-solid fa-star"></i> ${m.rating}
                        </span>
                    </div>
                    <div class="p-3">
                        <h4 class="font-bold text-xs text-white truncate">${m.title}</h4>
                        <p class="text-[10px] text-slate-400 mt-0.5">${m.year} • ${m.duration}</p>
                        <button onclick="playMedia('${m.videoUrl}')" class="mt-3 w-full bg-red-600 hover:bg-red-700 text-white py-1.5 rounded-lg text-xs font-bold flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-play"></i> تەماشابکە
                        </button>
                    </div>
                </div>
            `;
        });

        html += `</div>`;
        container.innerHTML = html;
    }

    function renderSeries() {
        const container = document.getElementById('mainContainer');
        let html = `<h3 class="text-base font-bold text-white mb-4">زنجیرە</h3><div class="space-y-4">`;
        
        seriesData.forEach(s => {
            html += `
                <div class="bg-slate-900/60 rounded-xl p-3 border border-slate-800 flex gap-3">
                    <img src="${s.image}" class="w-24 h-32 object-cover rounded-lg">
                    <div class="flex-1 flex flex-col justify-between">
                        <div>
                            <h4 class="font-bold text-sm text-white">${s.title}</h4>
                            <p class="text-xs text-amber-400 mt-0.5"><i class="fa-solid fa-star"></i> ${s.rating} • ${s.seasons} وەرز</p>
                            <p class="text-xs text-slate-400 mt-1 line-clamp-2">${s.description}</p>
                        </div>
                        <button onclick="openSeriesDetails('${s.id}')" class="bg-slate-800 hover:bg-slate-700 text-xs py-1.5 px-3 rounded-lg text-white font-medium self-start mt-2 border border-slate-700">
                            وەرز و ئەلقە
                        </button>
                    </div>
                </div>
            `;
        });
        html += `</div>`;
        container.innerHTML = html;
    }

    function openSeriesDetails(seriesId) {
        const series = seriesData.find(s => s.id === seriesId);
        if(!series) return;
        const container = document.getElementById('mainContainer');
        
        let html = `
            <button onclick="renderSeries()" class="mb-3 text-xs text-slate-400 flex items-center gap-1"><i class="fa-solid fa-arrow-right"></i> زڤڕین بۆ زنجیران</button>
            <h2 class="text-xl font-bold text-white mb-1">${series.title}</h2>
            <p class="text-xs text-slate-400 mb-4">${series.description}</p>
        `;

        if(series.episodes) {
            html += `<div class="space-y-4">`;
            for(let seasonKey in series.episodes) {
                const sNum = seasonKey.replace('s', '');
                html += `
                    <div class="bg-slate-900/60 rounded-xl p-3 border border-slate-800">
                        <h4 class="font-bold text-xs text-red-500 mb-2">وەرزێ ${sNum}</h4>
                        <div class="space-y-2">
                `;
                series.episodes[seasonKey].forEach(ep => {
                    html += `
                        <div class="flex justify-between items-center bg-slate-800/50 p-2 rounded-lg text-xs">
                            <span class="text-slate-200">${ep.title} (${ep.duration})</span>
                            <button onclick="playMedia('${ep.videoUrl}')" class="text-red-500 font-bold hover:underline">تەماشابکە</button>
                        </div>
                    `;
                });
                html += `</div></div>`;
            }
            html += `</div>`;
        } else {
            html += `<p class="text-xs text-slate-500">ئەلقە د ڕێدانە...</p>`;
        }
        container.innerHTML = html;
    }

    function renderWatchlist() {
        const container = document.getElementById('mainContainer');
        const saved = moviesData.filter(m => watchlist.includes(m.id));
        
        if(saved.length === 0) {
            container.innerHTML = `
                <div class="text-center py-20 text-slate-500">
                    <i class="fa-solid fa-bookmark text-4xl mb-3 block"></i>
                    <p class="text-sm">پەرتووکخانا تە بەتالە.</p>
                </div>
            `;
            return;
        }

        container.innerHTML = `<h3 class="text-base font-bold text-white mb-4">پەرتووکخانا من</h3>
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">` + 
        saved.map(m => `
            <div class="bg-slate-900/60 rounded-xl p-2 border border-slate-800">
                <img src="${m.image}" class="w-full aspect-[2/3] object-cover rounded-lg mb-2">
                <h4 class="font-bold text-xs text-white truncate">${m.title}</h4>
                <button onclick="toggleSave('${m.id}')" class="mt-2 w-full bg-red-950/60 text-red-400 border border-red-800/40 py-1 rounded text-[10px]">لادان</button>
            </div>
        `).join('') + `</div>`;
    }

    function renderProfile() {
        const container = document.getElementById('mainContainer');
        container.innerHTML = `
            <div class="bg-slate-900/60 p-6 rounded-2xl border border-slate-800 text-center max-w-md mx-auto">
                <div class="w-20 h-20 bg-slate-800 rounded-full mx-auto mb-3 flex items-center justify-center text-3xl text-red-500 border border-slate-700">
                    <i class="fa-solid fa-user"></i>
                </div>
                <h3 class="font-bold text-lg text-white">پرۆفایلێ من</h3>
                <p class="text-xs text-slate-400 mt-1">Status: VIP User</p>
                
                <div class="mt-6 border-t border-slate-800 pt-4 text-right space-y-3 text-xs text-slate-300">
                    <div class="flex justify-between py-1"><span>فیلمێن پاشکەوتکری:</span> <span class="font-bold text-red-500">${watchlist.length}</span></div>
                    <div class="flex justify-between py-1"><span>زمانی ماڵپەڕی:</span> <span>کوردیا بادینی</span></div>
                </div>

                <button onclick="openAuthModal()" class="mt-6 w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded-xl text-xs font-bold transition">
                    چوونەژوور ب هەژمارەکا دی
                </button>
            </div>
        `;
    }

    function toggleSave(id) {
        if(watchlist.includes(id)) {
            watchlist = watchlist.filter(i => i !== id);
        } else {
            watchlist.push(id);
        }
        localStorage.setItem('cinelib_watchlist', JSON.stringify(watchlist));
        switchTab(currentTab);
    }

    function playMedia(url) {
        document.getElementById('videoPlayer').src = url;
        document.getElementById('playerModal').classList.remove('hidden');
    }

    function closePlayer() {
        document.getElementById('videoPlayer').src = '';
        document.getElementById('playerModal').classList.add('hidden');
    }

    function openAuthModal() { document.getElementById('authModal').classList.remove('hidden'); }
    function closeAuthModal() { document.getElementById('authModal').classList.add('hidden'); }
    function handleAuth(e) {
        e.preventDefault();
        alert('تۆ ب سەرکەفتن داخیلی هەژمارا خۆ بووی!');
        closeAuthModal();
    }

    function handleSearch() {
        const query = document.getElementById('searchInput').value;
        if(currentTab === 'movies') renderMovies(query);
    }

    // Start on Movies
    switchTab('movies');
</script>
</body>
</html>
